<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지역 비교 - 청소년 지역 이슈 균형정보 플랫폼</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .page-head {
      max-width: 860px;
      margin: 0 auto;
      padding: 36px 20px 8px;
    }
    .page-head__title {
      font-size: 22px;
      font-weight: 800;
      color: var(--navy-900);
      margin: 12px 0 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) .page-head__title { color: #eaf1f8; }
    }
    :root[data-theme="dark"] .page-head__title { color: #eaf1f8; }
    .page-head__desc {
      font-size: 13.5px;
      color: var(--text-secondary);
      margin: 0 0 12px;
    }

    .section {
      max-width: 860px;
      margin: 0 auto;
      padding: 20px 20px 60px;
    }

    /* 탭 */
    .region-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .region-tab {
      font-size: 13.5px;
      font-weight: 700;
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
    }
    .region-tab.is-active {
      background: var(--navy-800);
      border-color: var(--navy-800);
      color: #fff;
    }

    /* 비교표 */
    .table-card { padding: 22px 24px; margin-bottom: 28px; }
    .table-caption {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .compare-table { width: 100%; border-collapse: collapse; }
    .compare-table th,
    .compare-table td {
      text-align: left;
      padding: 13px 14px;
      font-size: 13.5px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .compare-table tr:last-child th,
    .compare-table tr:last-child td { border-bottom: none; }
    .compare-table th {
      width: 120px;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 12.5px;
      white-space: nowrap;
    }
    .compare-table td { color: var(--text-primary); font-weight: 600; }

    /* 질문 */
    .qa-card { padding: 22px 24px; }
    .qa-card__title { font-size: 15px; font-weight: 800; margin: 0 0 4px; }
    .qa-card__desc { font-size: 13px; color: var(--text-secondary); margin: 0 0 18px; }
    .qa-list { display: flex; flex-direction: column; gap: 18px; }
    .qa-item label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .qa-item textarea {
      width: 100%;
      min-height: 70px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 13.5px;
      font-family: inherit;
      resize: vertical;
      background: var(--surface);
      color: var(--text-primary);
    }

    .progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }
    .progress-text { font-size: 13px; color: var(--text-secondary); font-weight: 600; }
    .progress-text strong { color: var(--navy-700); }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) .progress-text strong { color: #9ec5f4; }
    }
    :root[data-theme="dark"] .progress-text strong { color: #9ec5f4; }
  </style>
</head>
<body data-page="regions">
  <div id="app-header"></div>

  <main>
    <div class="page-head">
      <span class="eyebrow">지역 비교</span>
      <h1 class="page-head__title" id="issue-title">이슈를 불러오는 중입니다...</h1>
      <p class="page-head__desc">
        내 지역 기사만 반복해서 보면 지역 중심 정보가 또 다른 필터버블이 될
        수 있습니다. 같은 이슈를 다룬 다른 지역과 전국 단위 보도를 함께
        확인해 보세요.
      </p>
      <span class="sample-tag">예시 데이터 · 정책 제안 보고서 요약 기반</span>
    </div>

    <section class="section">
      <div class="region-tabs" id="region-tabs"><!-- JS로 채움 --></div>

      <div class="card table-card">
        <div class="table-caption" id="table-caption"></div>
        <table class="compare-table">
          <tbody>
            <tr>
              <th scope="row">주요 피해자</th>
              <td id="cell-victim"></td>
            </tr>
            <tr>
              <th scope="row">책임 주체</th>
              <td id="cell-responsible"></td>
            </tr>
            <tr>
              <th scope="row">주요 감정</th>
              <td id="cell-emotion"></td>
            </tr>
            <tr>
              <th scope="row">해결책</th>
              <td id="cell-solution"></td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="card qa-card">
        <p class="qa-card__title">직접 생각해 보세요</p>
        <p class="qa-card__desc">
          아래 네 가지 질문 중 두 개 이상에 답하면 다음 단계로 이동할 수
          있습니다.
        </p>
        <div class="qa-list" id="qa-list">
          <div class="qa-item">
            <label for="qa-1">지역에 따라 같은 문제의 피해자가 다르게 설정되었습니까</label>
            <textarea id="qa-1" placeholder="자유롭게 생각을 적어 보세요"></textarea>
          </div>
          <div class="qa-item">
            <label for="qa-2">특정 지역의 기사에서만 반복된 감정 표현이 있습니까</label>
            <textarea id="qa-2" placeholder="자유롭게 생각을 적어 보세요"></textarea>
          </div>
          <div class="qa-item">
            <label for="qa-3">지역별로 제시한 해결책이 다른 이유는 무엇이라고 생각합니까</label>
            <textarea id="qa-3" placeholder="자유롭게 생각을 적어 보세요"></textarea>
          </div>
          <div class="qa-item">
            <label for="qa-4">이 문제를 한 지역만의 관점으로 이해했을 때 놓칠 수 있는 부분은 무엇입니까</label>
            <textarea id="qa-4" placeholder="자유롭게 생각을 적어 보세요"></textarea>
          </div>
        </div>

        <div class="progress-row">
          <span class="progress-text">
            <strong id="qa-count">0</strong> / 4 질문에 답변했습니다 (최소 2개 필요)
          </span>
          <button type="button" id="btn-next" class="btn btn-primary" disabled>
            다음 단계로 (감정 자가 점검)
          </button>
        </div>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="assets/js/region-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/region-compare-data.js"></script>
  <script src="assets/js/region-compare.js"></script>
</body>
</html>
