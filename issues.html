<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지역 이슈 선택 - 청소년 지역 이슈 균형정보 플랫폼</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .page-head {
      max-width: 960px;
      margin: 0 auto;
      padding: 36px 20px 8px;
    }
    .page-head__title {
      font-size: 24px;
      font-weight: 800;
      color: var(--navy-900);
      margin: 12px 0 6px;
    }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) .page-head__title { color: #eaf1f8; }
    }
    :root[data-theme="dark"] .page-head__title { color: #eaf1f8; }
    .page-head__desc { color: var(--text-secondary); font-size: 14.5px; margin: 0 0 4px; }
    .page-head__region {
      font-size: 13px;
      color: var(--text-muted);
      margin: 4px 0 0;
    }
    .page-head__region a { color: var(--navy-700); font-weight: 600; text-decoration: none; }
    .page-head__region a:hover { text-decoration: underline; }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) .page-head__region a { color: #9ec5f4; }
    }
    :root[data-theme="dark"] .page-head__region a { color: #9ec5f4; }

    .section {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    .issue-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    @media (max-width: 900px) {
      .issue-grid { grid-template-columns: 1fr; }
    }

    .issue-card {
      display: flex;
      flex-direction: column;
      padding: 22px 20px 20px;
    }
    .issue-card__index {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--navy-100);
      color: var(--navy-800);
      font-size: 12.5px;
      font-weight: 800;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) .issue-card__index { color: #cfe0f2; }
    }
    :root[data-theme="dark"] .issue-card__index { color: #cfe0f2; }

    .issue-card__title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-primary);
      margin: 0 0 10px;
    }
    .issue-card__desc {
      font-size: 13.5px;
      color: var(--text-secondary);
      margin: 0 0 16px;
      flex: 1;
    }

    .issue-card__question {
      background: var(--surface-2);
      border-left: 3px solid var(--accent-teal);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 12px 14px;
      margin: 0 0 16px;
    }
    .issue-card__question-label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .issue-card__question-text {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.5;
    }

    .issue-card__meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-bottom: 18px;
    }
    .issue-card__meta-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .issue-card__meta-label { color: var(--text-muted); }
    .issue-card__meta-value { font-weight: 700; color: var(--text-primary); text-align: right; }

    .page-note {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px;
    }
  </style>
</head>
<body data-page="issues">
  <div id="app-header"></div>

  <main>
    <div class="page-head">
      <span class="eyebrow">지역 이슈 선택</span>
      <h1 class="page-head__title">어떤 지역 이슈를 비교해 볼까요?</h1>
      <p class="page-head__desc">
        정책 제안 보고서와 연결된 세 가지 대주제 중 하나를 선택하면 관련 기사
        비교 화면으로 이동합니다.
      </p>
      <p class="page-head__region" id="region-line"></p>
    </div>

    <section class="section">
      <div class="issue-grid" id="issue-grid">
        <p class="muted" style="padding:12px 2px;">이슈를 불러오는 중입니다...</p>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="assets/js/region-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/articles-api.js"></script>
  <script src="assets/js/issues-api.js"></script>
  <script src="assets/js/issues.js"></script>
</body>
</html>
