<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 - 청소년 지역 이슈 균형정보 플랫폼</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .page-head {
      max-width: 560px;
      margin: 0 auto;
      padding: 36px 20px 8px;
    }
    .page-head__title {
      font-size: 22px;
      font-weight: 800;
      color: var(--navy-900);
      margin: 12px 0 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) .page-head__title { color: #eaf1f8; }
    }
    :root[data-theme="dark"] .page-head__title { color: #eaf1f8; }
    .page-head__desc { font-size: 13.5px; color: var(--text-secondary); margin: 0; }

    .section {
      max-width: 560px;
      margin: 0 auto;
      padding: 20px 20px 60px;
    }

    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .mode-tab {
      flex: 1;
      font-size: 14px;
      font-weight: 700;
      padding: 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      text-align: center;
    }
    .mode-tab.is-active { background: var(--navy-800); border-color: var(--navy-800); color: #fff; }

    .mode-panel { display: none; }
    .mode-panel.is-active { display: block; }

    .form-card { padding: 24px; }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 11px 13px;
      font-size: 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text-primary);
    }
    .field__helper { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

    .sub-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
    .sub-toggle button {
      flex: 1;
      font-size: 13px;
      font-weight: 700;
      padding: 8px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
    }
    .sub-toggle button.is-active { background: var(--navy-100); border-color: var(--navy-700); color: var(--navy-800); }

    .status-card {
      padding: 20px 24px;
      margin-bottom: 20px;
      display: none;
    }
    .status-card.is-visible { display: block; }
    .status-card__label { font-size: 12.5px; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; }
    .status-card__value { font-size: 15px; font-weight: 800; color: var(--text-primary); }
    .action-list { display: flex; flex-direction: column; gap: 10px; }
  </style>
</head>
<body data-page="login">
  <div id="app-header"></div>

  <main>
    <div class="page-head">
      <span class="eyebrow">로그인</span>
      <h1 class="page-head__title">이용 방식을 선택해 주세요</h1>
      <p class="page-head__desc">
        비회원은 가입 없이 식별번호만으로 바로 설문에 참여할 수 있고,
        회원으로 로그인하면 참여 기록을 자동으로 이어볼 수 있습니다.
      </p>
    </div>

    <section class="section">
      <div class="card status-card" id="status-card">
        <div class="status-card__label">현재 상태</div>
        <div class="status-card__value" id="status-value">-</div>
        <div class="action-list" style="margin-top:14px;">
          <button type="button" id="btn-logout" class="btn btn-secondary btn-block">로그아웃 / 전환하기</button>
        </div>
      </div>

      <div class="mode-tabs">
        <button type="button" class="mode-tab" data-mode="guest">비회원</button>
        <button type="button" class="mode-tab" data-mode="member">회원</button>
        <button type="button" class="mode-tab" data-mode="admin">관리자</button>
      </div>

      <!-- 비회원 -->
      <div class="mode-panel" id="panel-guest">
        <div class="card form-card">
          <div class="form-banner form-banner--error" id="guest-error">
            식별번호는 숫자 4자리로 입력해 주세요.
          </div>
          <div class="field">
            <label for="guest-code">식별번호 (숫자 4자리)</label>
            <input type="text" id="guest-code" inputmode="numeric" maxlength="4" placeholder="예: 1234" />
            <p class="field__helper">
              본인만 기억할 수 있는 번호를 입력하세요. 이름이나 생년월일처럼
              다른 사람이 추측하기 쉬운 번호는 피하는 것이 좋습니다. 같은
              번호를 다시 입력하면 이전 응답과 이어집니다.
            </p>
          </div>
          <button type="button" id="btn-guest-continue" class="btn btn-primary btn-block">이 번호로 계속하기</button>
        </div>
      </div>

      <!-- 회원 -->
      <div class="mode-panel" id="panel-member">
        <div class="card form-card">
          <div class="sub-toggle">
            <button type="button" class="is-active" data-sub="signin">로그인</button>
            <button type="button" data-sub="signup">회원가입</button>
          </div>
          <div class="form-banner form-banner--error" id="member-error"></div>
          <div class="form-banner form-banner--success" id="member-success"></div>
          <div class="field">
            <label for="member-email">이메일</label>
            <input type="email" id="member-email" autocomplete="email" />
          </div>
          <div class="field">
            <label for="member-password">비밀번호</label>
            <input type="password" id="member-password" autocomplete="current-password" />
            <p class="field__helper">비밀번호는 6자 이상 입력해 주세요.</p>
          </div>
          <button type="button" id="btn-member-submit" class="btn btn-primary btn-block">로그인</button>
        </div>
      </div>

      <!-- 관리자 -->
      <div class="mode-panel" id="panel-admin">
        <div class="card form-card">
          <div class="form-banner form-banner--error" id="admin-error"></div>
          <div class="field">
            <label for="admin-email">관리자 이메일</label>
            <input type="email" id="admin-email" autocomplete="email" />
          </div>
          <div class="field">
            <label for="admin-password">비밀번호</label>
            <input type="password" id="admin-password" autocomplete="current-password" />
          </div>
          <button type="button" id="btn-admin-submit" class="btn btn-primary btn-block">관리자 로그인</button>
        </div>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="assets/js/region-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
